name: ci

# Two gates:
#   model   (ubuntu)  the object × action matrix and the property sets match the pinned CAR model
#                     exactly, cross-checked against Byakugan's `car-vocab` / `model/schema`; the
#                     generated table, JSON model and manifest are fresh.
#   channel (windows) the manifest compiles into the resource DLL, registers as the channel, and every
#                     EventID writes and reads back as object (Task) + action (Opcode) + properties; then
#                     the C# writer is built and run against a live process start/stop.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  model:
    name: pinned model ⇄ registry ⇄ generated table + manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true          # model/sources/car at its pinned commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --quiet pyyaml pytest

      - name: Submodule is at the commit PIN.yaml records
        run: |
          want=$(python -c "import yaml;print(yaml.safe_load(open('model/sources/byakugan/PIN.yaml'))['car_submodule']['commit'])")
          have=$(git -C model/sources/car rev-parse HEAD)
          echo "pinned=$want checked-out=$have"
          test "$want" = "$have"

      - name: Vendored Byakugan files are byte-identical to the pinned Byakugan commit
        run: |
          set -euo pipefail
          commit=$(python -c "import yaml;print(yaml.safe_load(open('model/sources/byakugan/PIN.yaml'))['commit'])")
          raw="https://raw.githubusercontent.com/Get-Sybers/Byakugan/$commit"
          curl -sSfL "$raw/model/schema/vocab/car-actions.schema.json"                        -o /tmp/car-actions.schema.json
          curl -sSfL "$raw/model/schema/matched-evidences.yaml"                              -o /tmp/matched-evidences.yaml
          curl -sSfL "$raw/model/sources/attack-datasources/attack_data_sources_objects.yaml" -o /tmp/attack_data_sources_objects.yaml
          cmp /tmp/car-actions.schema.json         model/sources/byakugan/car-actions.schema.json
          cmp /tmp/matched-evidences.yaml          model/sources/byakugan/matched-evidences.yaml
          cmp /tmp/attack_data_sources_objects.yaml model/sources/byakugan/attack_data_sources_objects.yaml

      - name: car-vocab.json equals Byakugan's published car_action lists at the pin
        run: |
          set -euo pipefail
          commit=$(python -c "import yaml;print(yaml.safe_load(open('model/sources/byakugan/PIN.yaml'))['commit'])")
          raw="https://raw.githubusercontent.com/Get-Sybers/Byakugan/$commit/model/car/objects"
          mkdir -p /tmp/car-objects
          for o in $(python -c "import json;print(' '.join(sorted(json.load(open('model/sources/byakugan/car-vocab.json')))))"); do
            curl -sSfL "$raw/$o.yml" -o "/tmp/car-objects/$o.yml"
          done
          python - <<'PY'
          import json, yaml, glob, os, sys
          want = json.load(open('model/sources/byakugan/car-vocab.json'))
          have = {os.path.basename(p)[:-4]: sorted(yaml.safe_load(open(p))['car_action'])
                  for p in glob.glob('/tmp/car-objects/*.yml')}
          if have != want:
              print('car-vocab drift:', {k: (want.get(k), have.get(k)) for k in set(want) | set(have) if want.get(k) != have.get(k)})
              sys.exit(1)
          print('car-vocab.json matches model/car/objects at the pin:', len(have), 'objects')
          PY

      - name: Validate the model and fail on generated-output drift (table, JSON, manifest)
        run: python tools/carmodel.py check

      - name: Unit tests
        run: python -m pytest -q tests

  channel:
    name: manifest → resource DLL → channel → write/read every EventID
    runs-on: windows-latest
    needs: model
    steps:
      - uses: actions/checkout@v4

      - name: Build GetSybersMitreCar.dll (mc.exe → rc.exe → link.exe /noentry — resources only, no source code)
        shell: pwsh
        run: ./scripts/Build-Manifest.ps1 -OutDir build

      - name: Register the provider and the Get-Sybers-MitreCAR/Operational channel (wevtutil im)
        shell: pwsh
        run: ./scripts/Install-Provider.ps1 -Dll build/GetSybersMitreCar.dll

      - name: Write one populated and one empty event per EventID, read all back, verify object/action/properties
        shell: powershell
        run: ./scripts/Test-Channel.ps1 -Header build/GetSybersMitreCar.h

      - name: Build the writer (C#, .NET Framework 4.8)
        shell: pwsh
        run: dotnet build src/GetSybersMitreCar.Writer -c Release -nologo

      - name: Run the writer against a live process start and stop; read process/create and process/terminate back
        shell: pwsh
        run: ./scripts/Test-Writer.ps1

      - name: Unregister
        if: always()
        shell: pwsh
        run: ./scripts/Uninstall-Provider.ps1

      - name: Publish the installable set (resource DLL, manifest, writer, scripts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GetSybersMitreCar
          path: |
            build/GetSybersMitreCar.dll
            build/GetSybersMitreCar.h
            manifest/GetSybersMitreCar.man
            src/GetSybersMitreCar.Writer/bin/Release/net48/
            scripts/*.ps1
