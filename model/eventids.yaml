  - {name: acl_modify,    opcode: 11, symbol: GSCAR_OP_ACL_MODIFY}
  - {name: add,           opcode: 12, symbol: GSCAR_OP_ADD}
  - {name: bind,          opcode: 13, symbol: GSCAR_OP_BIND}
  - {name: block,         opcode: 14, symbol: GSCAR_OP_BLOCK}
  - {name: close,         opcode: 15, symbol: GSCAR_OP_CLOSE}
  - {name: create,        opcode: 16, symbol: GSCAR_OP_CREATE}
  - {name: delete,        opcode: 17, symbol: GSCAR_OP_DELETE}
  - {name: deliver,       opcode: 18, symbol: GSCAR_OP_DELIVER}
  - {name: end,           opcode: 19, symbol: GSCAR_OP_END}
  - {name: error,         opcode: 20, symbol: GSCAR_OP_ERROR}
  - {name: failure,       opcode: 21, symbol: GSCAR_OP_FAILURE}
  - {name: get,           opcode: 22, symbol: GSCAR_OP_GET}
  - {name: key_edit,      opcode: 23, symbol: GSCAR_OP_KEY_EDIT}
  - {name: listen,        opcode: 24, symbol: GSCAR_OP_LISTEN}
  - {name: load,          opcode: 25, symbol: GSCAR_OP_LOAD}
  - {name: lock,          opcode: 26, symbol: GSCAR_OP_LOCK}
  - {name: login,         opcode: 27, symbol: GSCAR_OP_LOGIN}
  - {name: logout,        opcode: 28, symbol: GSCAR_OP_LOGOUT}
  - {name: message,       opcode: 29, symbol: GSCAR_OP_MESSAGE}
