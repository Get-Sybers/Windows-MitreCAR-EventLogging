  - {name: suspend,       opcode: 43, symbol: GSCAR_OP_SUSPEND}
  - {name: terminate,     opcode: 44, symbol: GSCAR_OP_TERMINATE}
  - {name: timestomp,     opcode: 45, symbol: GSCAR_OP_TIMESTOMP}
