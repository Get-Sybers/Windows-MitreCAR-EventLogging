# model/eventids.yaml — THE EventID registry.
#
# Hand-pinned and reviewed. The generator (tools/carmodel.py) VALIDATES this file against the pinned
# model and renders the EventID table from it; it never renumbers. Once a number is published it is
# wire format: an action or object that leaves the model keeps its number as `retired`, a new one
# takes the next free slot in its range. Changing a published number is a schema-version bump.
#
# Sources this file is checked against (see model/sources/):
#   - model/sources/car            the pinned MITRE CAR data model (objects, actions, property sets)
#   - model/sources/byakugan/car-vocab.json          the canonical car_action vocabulary (`byakugan car-vocab`)
#   - model/sources/byakugan/car-actions.schema.json the model/schema vocabulary (adds the promoted objects)
#
# Invariants the generator enforces:
#   * exactly one event per (object, action) in car-vocab; none outside it
#   * EventID = object base + offset; offsets 1–49 for actions in the pinned CAR submodule
#     (`provenance: car`), 50–99 for actions car-vocab adds from the ATT&CK data-component overlay
#     (`provenance: superset`) — so the pinned-CAR numbers never move whatever is decided about the overlay
#   * Task = EventID div 100 (the hundreds digits ARE the object): filter by Task, slice by ID range
#   * one global Opcode per action name (custom opcodes 10–238; 0–9 reserved by ETW), so
#     "Opcode = create" selects creates across every object
#   * one Keyword bit per object (bits 0–47 are provider-defined; the top 16 are reserved by ETW)

schema_version: 1

provider:                       # names are DECISION ITEMS (docs/Decisions.md §D5) — proposed defaults
  name: Get-Sybers-MitreCAR
  symbol: GSCAR
  guid: 5bc454ac-3ed9-4b89-b9f4-af8202af0ed8     # proposed; freshly generated (uuid4) — replace if a GUID is already allocated
  channel:
    name: Get-Sybers-MitreCAR/Operational
    type: Operational
    symbol: GSCAR_CHANNEL_OPERATIONAL

id_scheme:
  object_range_width: 100
  task_rule: "Task = EventID div 100"
  offsets:
    car: [1, 49]            # actions present in the pinned CAR submodule (model/sources/car/data_model/*.yaml)
    superset: [50, 99]      # actions car-vocab adds from the ATT&CK data-component overlay (same object, no new fields)
  opcode_range: [10, 238]   # provider-defined ETW opcode values
  keyword_bits: [0, 47]     # provider-defined ETW keyword bits
  # Initial numbering rule (applied once, 2026-10-24; pinned thereafter): within an object, the
  # actions the mission brief listed as examples come first in the brief's order, then the remaining
  # pinned-CAR actions in the order the CAR data_model/<object>.yaml lists them; superset-only
  # actions follow alphabetically from offset 50.

objects:
  # name           task  base  keyword bit (mask)                 symbol
  - {name: process,        task: 10, base: 1000, keyword: 0x0000000000000001, keyword_symbol: GSCAR_KW_PROCESS}
  - {name: file,           task: 11, base: 1100, keyword: 0x0000000000000002, keyword_symbol: GSCAR_KW_FILE}
  - {name: flow,           task: 12, base: 1200, keyword: 0x0000000000000004, keyword_symbol: GSCAR_KW_FLOW}
  - {name: registry,       task: 13, base: 1300, keyword: 0x0000000000000008, keyword_symbol: GSCAR_KW_REGISTRY}
  - {name: module,         task: 14, base: 1400, keyword: 0x0000000000000010, keyword_symbol: GSCAR_KW_MODULE}
  - {name: thread,         task: 15, base: 1500, keyword: 0x0000000000000020, keyword_symbol: GSCAR_KW_THREAD}
  - {name: driver,         task: 16, base: 1600, keyword: 0x0000000000000040, keyword_symbol: GSCAR_KW_DRIVER}
  - {name: service,        task: 17, base: 1700, keyword: 0x0000000000000080, keyword_symbol: GSCAR_KW_SERVICE}
  - {name: user_session,   task: 18, base: 1800, keyword: 0x0000000000000100, keyword_symbol: GSCAR_KW_USER_SESSION}
  - {name: authentication, task: 19, base: 1900, keyword: 0x0000000000000200, keyword_symbol: GSCAR_KW_AUTHENTICATION}
  - {name: socket,         task: 20, base: 2000, keyword: 0x0000000000000400, keyword_symbol: GSCAR_KW_SOCKET}
  - {name: http,           task: 21, base: 2100, keyword: 0x0000000000000800, keyword_symbol: GSCAR_KW_HTTP}
  - {name: email,          task: 22, base: 2200, keyword: 0x0000000000001000, keyword_symbol: GSCAR_KW_EMAIL}

# Objects the model/schema vocabulary (car-actions.schema.json) carries beyond the 13 CAR objects:
# promoted from the ATT&CK superset by docs/research/car-vocabulary-ruling.md. They have an action
# enum but NO CAR field set in the pinned model, so no template can be derived for them without
# inventing fields. Ranges are reserved so adopting them later never renumbers anything.
promoted_objects:
  - {name: group,         task: 23, base: 2300, keyword: 0x0000000000002000, keyword_symbol: GSCAR_KW_GROUP,         actions: [create, delete, enumerate, metadata, modify]}
  - {name: scheduled_job, task: 24, base: 2400, keyword: 0x0000000000004000, keyword_symbol: GSCAR_KW_SCHEDULED_JOB, actions: [create, delete, metadata, modify]}
  - {name: user_account,  task: 25, base: 2500, keyword: 0x0000000000008000, keyword_symbol: GSCAR_KW_USER_ACCOUNT,  actions: [create, delete, metadata, modify]}

reserved_ranges:
  - {range: [9000, 9099], task: 90, keyword: 0x0000800000000000, keyword_symbol: GSCAR_KW_SENSOR,
     purpose: "sensor self-events (not CAR): service start/stop, configuration, provider enabled/silent, event drops, PPL availability — the 'going silent is a signal' hazard (brief §7)"}

# One global Opcode per CAR action name. Pinned-CAR action names were assigned alphabetically from
# 10; the five names only the superset adds (content, enumerate, execute, flow, metadata) follow.
