  - {name: pause,         opcode: 31, symbol: GSCAR_OP_PAUSE}
  - {name: post,          opcode: 32, symbol: GSCAR_OP_POST}
  - {name: put,           opcode: 33, symbol: GSCAR_OP_PUT}
  - {name: quarantine,    opcode: 34, symbol: GSCAR_OP_QUARANTINE}
