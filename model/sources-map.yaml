# model/sources-map.yaml - the provider->CAR map: which live Windows telemetry supplies each (object, action)
# and each property. Deliverable 5 of the brief, as data. The C# writer implements exactly this; the unit
# tests check every pair and property named here exists in the model.
#
# status: implemented (in the writer today) | planned (source identified, not yet consumed) |
#         none (no in-box live source - the EventID exists in the manifest, nothing populates it)
# property sources: "event <Field>" = the kernel event's payload; "live <what>" = read from the running
# system at the instant the event is handled (a token, a PEB, a file on disk, a registry value); "sensor" =
# the sensor's own earlier observation (its process/module/flow tables); "host" = the observing machine.
# Properties not listed are written empty (not observed). No value is inferred and no name is resolved by DNS.
sources:
  kernel:
    name: NT kernel logger (system trace), consumed in real time through Microsoft.Diagnostics.Tracing.TraceEvent
    session: GSCAR-Sensor
    keywords:
    - Process
    - Thread
    - ImageLoad
    - FileIO
    - FileIOInit
    - DiskFileIO
    - Registry
    - NetworkTCPIP
  security: Security channel (Microsoft-Windows-Security-Auditing), push subscription (EvtSubscribe) - phase 2
  system: System channel (Service Control Manager, Winlogon, LsaSrv), push subscription - phase 2
  terminalservices: Microsoft-Windows-TerminalServices-LocalSessionManager/Operational, push subscription - phase 2
  afd: Microsoft-Windows-Winsock-AFD provider - phase 3
pairs:
- object: process
  action: create
  id: 1002
  status: implemented
  source: kernel
  trigger: Process/Start
  properties:
    hostname: host
    fqdn: host (when domain-joined)
    pid: event ProcessID
    ppid: event ParentID
    exe: event ImageFileName
    image_path: event KernelImageFileName (NT path -> drive path), else live QueryFullProcessImageName
    command_line: event CommandLine
    sid: event payload TOKEN_USER SID, else live token
    uid: same SID as sid
    user: live token account name, else LookupAccountSid(sid)
    integrity_level: 'live token (TokenIntegrityLevel: low/medium/high/system)'
    current_working_directory: live read of the process PEB (RTL_USER_PROCESS_PARAMETERS.CurrentDirectory)
    env_vars: live read of the process PEB environment block (off with --no-env-vars)
    md5_hash: live hash of image_path
    sha1_hash: live hash of image_path
    sha256_hash: live hash of image_path
    signer: live embedded Authenticode subject of image_path (catalog-signed files have none)
    signature_valid: live WinVerifyTrust of image_path
    parent_image_path: sensor process table, else live QueryFullProcessImageName(ppid)
    parent_exe: basename of parent_image_path
    parent_command_line: sensor process table, else live PEB read of the parent
- object: process
  action: terminate
  id: 1003
  status: implemented
  source: kernel
  trigger: Process/End
  properties:
    hostname: host
    fqdn: host (when domain-joined)
    pid: event ProcessID
    ppid: event ParentID
    exe: event ImageFileName
    command_line: event CommandLine
    image_path: event KernelImageFileName, else sensor process table
    sid: event payload TOKEN_USER SID, else sensor process table
    uid: same SID as sid
    user: sensor process table, else LookupAccountSid(sid)
    md5_hash: hash of image_path
    sha1_hash: hash of image_path
    sha256_hash: hash of image_path
    signer: embedded Authenticode subject of image_path
    signature_valid: WinVerifyTrust of image_path
    integrity_level: sensor process table (token label seen at this process's start)
    parent_image_path: sensor process table (seen at start)
    parent_exe: basename of parent_image_path
    parent_command_line: sensor process table (seen at start)
    current_working_directory: sensor process table (the directory the process started in)
    env_vars: sensor process table (the environment the process started with)
