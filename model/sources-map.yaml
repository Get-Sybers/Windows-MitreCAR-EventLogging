  trigger: TcpIp/Connect (outbound) and TcpIp/Accept (inbound), IPv4 and IPv6
  properties:
    hostname: host
    fqdn: host (when domain-joined)
    pid: event ProcessID
    ppid: sensor process table (parent of the owning process)
    image_path: sensor process table (owning process image), else live QueryFullProcessImageName
    exe: basename of image_path
    user: sensor process table / live token of the owning process
    uid: owning process token SID
    src_ip: event saddr
    src_port: event sport
    dest_ip: event daddr
    dest_port: event dport
    transport_protocol: tcp
    src_hostname: host, when src_ip is one of this host's own addresses (no DNS)
    src_fqdn: host fqdn, when src_ip is local
    dest_hostname: host, when dest_ip is one of this host's own addresses (no DNS)
    dest_fqdn: host fqdn, when dest_ip is local
    network_direction: outbound for Connect, inbound for Accept
    start_time: event timestamp (UTC, ISO 8601)
