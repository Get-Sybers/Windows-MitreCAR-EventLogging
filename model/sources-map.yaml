- object: file
  action: create
  id: 1102
  status: implemented
  source: kernel
  trigger: FileIO/Create with CreateDisposition Supersede, Create or OverwriteIf (a file is created or replaced)
  note: OpenIf opens an existing file in almost every call and is not counted as a creation
  properties:
    hostname: host
    fqdn: host (when domain-joined)
    pid: event ProcessID
    image_path: sensor process table (image path seen at process start), else live QueryFullProcessImageName
    user: sensor process table / live token (TokenUser -> account name)
    file_path: event FileName (NT path -> drive path)
    file_name: basename of file_path
    extension: suffix of file_path
    uid: live process token SID
    creation_time: live file creation time
    owner: live file owner account
    owner_uid: live file owner SID
- object: file
  action: delete
  id: 1103
  status: implemented
  source: kernel
  trigger: FileIO/Delete (FileDispositionInformation)
  properties: &id001
    hostname: host
    fqdn: host (when domain-joined)
    pid: event ProcessID
    image_path: sensor process table (image path seen at process start), else live QueryFullProcessImageName
    user: sensor process table / live token (TokenUser -> account name)
    file_path: event FileName (NT path -> drive path)
    file_name: basename of file_path
    extension: suffix of file_path
    uid: live process token SID
- object: file
  action: modify
  id: 1104
  status: implemented
  source: kernel
  trigger: FileIO/Rename; FileIO/SetInfo with any class other than FileBasicInformation
  properties: *id001
- object: file
  action: read
  id: 1105
  status: implemented
  source: kernel
  trigger: 'FileIO/Read (off by default: --file-reads)'
  properties: *id001
- object: file
  action: timestomp
  id: 1106
  status: implemented
  source: kernel
  trigger: FileIO/SetInfo with FileBasicInformation (timestamps and attributes)
  properties:
    hostname: host
    fqdn: host (when domain-joined)
    pid: event ProcessID
    image_path: sensor process table (image path seen at process start), else live QueryFullProcessImageName
    user: sensor process table / live token (TokenUser -> account name)
    file_path: event FileName (NT path -> drive path)
    file_name: basename of file_path
    extension: suffix of file_path
    uid: live process token SID
    creation_time: live file creation time after the change
- object: file
