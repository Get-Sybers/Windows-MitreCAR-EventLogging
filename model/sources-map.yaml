- object: flow
  action: start
  id: 1203
  status: implemented
  source: kernel
  trigger: TcpIp/Connect (outbound) and TcpIp/Accept (inbound), IPv4 and IPv6
  properties:
    hostname: host
    fqdn: host (when domain-joined)
    pid: event ProcessID
    image_path: sensor process table (image path seen at process start), else live QueryFullProcessImageName
    user: sensor process table / live token (TokenUser -> account name)
    exe: basename of image_path
    src_ip: event saddr
    src_port: event sport
    dest_ip: event daddr
    dest_port: event dport
    uid: live process token SID
    transport_protocol: tcp
    network_direction: outbound for Connect, inbound for Accept
    start_time: event timestamp (UTC, ISO 8601)
- object: flow
  action: end
  id: 1201
  status: implemented
  source: kernel
  trigger: TcpIp/Disconnect, IPv4 and IPv6
  properties:
    hostname: host
    fqdn: host (when domain-joined)
    pid: event ProcessID
    image_path: sensor process table (image path seen at process start), else live QueryFullProcessImageName
    user: sensor process table / live token (TokenUser -> account name)
    exe: basename of image_path
    src_ip: event saddr
    src_port: event sport
    dest_ip: event daddr
    dest_port: event dport
    uid: live process token SID
    transport_protocol: tcp
    end_time: event timestamp (UTC, ISO 8601)
- object: flow
  action: message
  id: 1202
  status: implemented
  source: kernel
  trigger: 'TcpIp/Send, TcpIp/Recv, UdpIp/Send, UdpIp/Recv (off by default: --flow-messages)'
  properties:
    hostname: host
    fqdn: host (when domain-joined)
    pid: event ProcessID
    image_path: sensor process table (image path seen at process start), else live QueryFullProcessImageName
    user: sensor process table / live token (TokenUser -> account name)
    exe: basename of image_path
    src_ip: event saddr
    src_port: event sport
    dest_ip: event daddr
    dest_port: event dport
    uid: live process token SID
    transport_protocol: tcp or udp
    out_bytes: event size on send
    in_bytes: event size on receive
- object: flow
  action: content
  id: 1250
  status: none
- object: flow
  action: create
  id: 1251
  status: none
  note: the connect event is emitted as flow/start
- object: flow
