- object: registry
  action: add
  id: 1301
  status: implemented
  source: kernel
  trigger: Registry/Create (NtCreateKey)
  note: the kernel event carries no disposition, so NtCreateKey on an existing key also yields registry/add
  properties:
    hostname: host
    fqdn: host (when domain-joined)
    pid: event ProcessID
    image_path: sensor process table (image path seen at process start), else live QueryFullProcessImageName
    user: sensor process table / live token (TokenUser -> account name)
    key: event KeyName (\REGISTRY\MACHINE -> HKLM, \REGISTRY\USER -> HKU)
    hive: root of KeyName (HKEY_LOCAL_MACHINE, HKEY_USERS)
- object: registry
  action: remove
  id: 1303
  status: implemented
  source: kernel
  trigger: Registry/Delete (a key) and Registry/DeleteValue (a value)
  properties:
    hostname: host
    fqdn: host (when domain-joined)
    pid: event ProcessID
    image_path: sensor process table (image path seen at process start), else live QueryFullProcessImageName
    user: sensor process table / live token (TokenUser -> account name)
    key: event KeyName
    value: event ValueName (DeleteValue)
    hive: root of KeyName
- object: registry
  action: value_edit
  id: 1304
  status: implemented
  source: kernel
  trigger: Registry/SetValue
  properties:
    hostname: host
    fqdn: host (when domain-joined)
    pid: event ProcessID
    image_path: sensor process table (image path seen at process start), else live QueryFullProcessImageName
    user: sensor process table / live token (TokenUser -> account name)
    key: event KeyName
    value: event ValueName
    hive: root of KeyName
    data: live read of the value after the set
    type: live value type (REG_SZ, REG_DWORD, ...)
    new_content: same as data
- object: registry
  action: key_edit
  id: 1302
  status: planned
  source: Security 4657 (no kernel ETW rename event)
- object: registry
  action: access
  id: 1350
  status: implemented
  source: kernel
  trigger: 'Registry/Open and Registry/QueryValue (off by default: --registry-access)'
  properties:
    hostname: host
    fqdn: host (when domain-joined)
