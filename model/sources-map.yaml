  properties:
    hostname: host
    fqdn: host (when domain-joined)
    pid: event ProcessID
    ppid: sensor process table (parent of the acting process)
    image_path: sensor process table (acting process image), else live QueryFullProcessImageName
    user: sensor process table / live token of the acting process
    uid: acting process token SID
    md5_hash: hash of image_path (CAR defines the file hashes on the acting process image)
    sha1_hash: hash of image_path
    sha256_hash: hash of image_path
    signer: embedded Authenticode subject of image_path
    signature_valid: WinVerifyTrust of image_path
    company: CompanyName in the version resource of image_path
    file_path: event FileName (NT path -> drive path)
    file_name: basename of file_path
    extension: suffix of file_path
    creation_time: live creation time of file_path on disk
    owner: live owner account of file_path
    owner_uid: live owner SID of file_path
    group: live primary group of file_path (security descriptor)
    gid: live primary group SID of file_path
    mode: live DACL of file_path in SDDL form
    link_target: live reparse target of file_path (symlink or junction), -> drive path
    mime_type: HKLM\Software\Classes\<extension> Content Type
