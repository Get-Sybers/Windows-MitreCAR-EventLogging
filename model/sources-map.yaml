    dest_fqdn: host fqdn, when dest_ip is local
    network_direction: sensor flow table (direction seen at start)
    start_time: sensor flow table (time the connect/accept was seen)
    end_time: event timestamp (UTC, ISO 8601)
    in_bytes: bytes received on this flow, counted from the kernel send/recv events since its start
    out_bytes: bytes sent on this flow, counted since its start
    packet_count: send + receive events counted on this flow since its start
