# model/templates.yaml — the templates: one per CAR object, reused across that object's actions.
#
# The field LIST per object is not declared here — it is read from the pinned model
# (model/sources/car/data_model/<object>.yaml) so it cannot drift. An event carries exactly the CAR
# object (Task), the action (Opcode) and the object's complete property set — nothing else
# (decision D4, 2026-10-24). Observed time and host come from the event's own System section
# (TimeCreated, Computer) and from the CAR fqdn/hostname properties where the model has them.
#
# Every field is `win:UnicodeString`. The brief (§2) requires "empty = not observed"; an ETW integer,
# boolean or FILETIME cannot be empty (0 / false / 1601-01-01 are values), and the model itself relies
# on the empty state (file.signature_valid: "empty if file is not signed"). A string can. So the type
# is uniform and what this file adds is the FORMAT the writer must use for a populated value — the
# CAR description/example decides it. Fields not listed under an object are `text`.

type: "win:UnicodeString"

formats:
  text:     {basis: "as observed — names, paths, '<DOMAIN>\\<USER>', free text; the writer truncates long text so a record stays well under the ~30 KB render limit"}
  int:      {pattern: "^[0-9]+$",                       basis: "a decimal integer — CAR: 'represented in decimal notation' (ids, ports, counts, byte sizes, status codes)"}
  int_ms:   {pattern: "^[0-9]+$",                       basis: "a duration in whole milliseconds (CAR example '12ms')"}
  hex:      {pattern: "^[0-9a-f]+$",                    basis: "lower-case hex digits, no prefix — CAR: hashes 'in hex notation, without the 0x prefix'"}
  hexaddr:  {pattern: "^0x[0-9A-Fa-f]+$",               basis: "0x-prefixed hex — CAR examples: addresses 0xFFFFF8000405F000, access_level 0x40, login_id 0xf61f3"}
  utc_time: {pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?Z$", basis: "a UTC instant as ISO 8601 'YYYY-MM-DDTHH:MM:SS.fffZ' — CAR: 'in UTC and including the date' (the examples' locale display form is not used)"}
  bool:     {pattern: "^(true|false)$",                 basis: "'true' or 'false' (CAR examples); empty when not observed — the model's own tri-state"}
  guid:     {pattern: "^\\{[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}\\}$", basis: "a GUID in registry format with braces (CAR example) — written only when the source telemetry supplies one, never minted"}
  ip:       {basis: "an IP address as text: IPv4 dotted-quad or RFC 5952 IPv6 (brief §6: no native IP type)"}

objects:
  authentication:
    response_time: int_ms
  driver:
    base_address: hexaddr
    md5_hash: hex
    sha1_hash: hex
    sha256_hash: hex
    pid: int
    signature_valid: bool
  email:
    attachment_size: int        # bytes; CAR's example is loose text ('567 Kb')
    dest_ip: ip
    dest_port: int
    date: utc_time              # the SMTP Date header, parsed to UTC
    src_ip: ip
    src_port: int
  file:
    creation_time: utc_time
    md5_hash: hex
    sha1_hash: hex
    sha256_hash: hex
    pid: int
    ppid: int
    previous_creation_time: utc_time
    signature_valid: bool
  flow:
    dest_ip: ip
    dest_port: int
    src_ip: ip
    src_port: int
    start_time: utc_time
    end_time: utc_time
    packet_count: int
    pid: int
    ppid: int
    in_bytes: int
    out_bytes: int
  http:
    request_body_bytes: int
    requester_ip_address: ip
    response_body_bytes: int
    response_status_code: int
  module:
    base_address: hexaddr
    md5_hash: hex
    sha1_hash: hex
    sha256_hash: hex
    pid: int
    tid: int
    signature_valid: bool
  process:
    md5_hash: hex
    sha1_hash: hex
    sha256_hash: hex
    pid: int
    ppid: int
    access_level: hexaddr
    guid: guid
    parent_guid: guid
    signature_valid: bool
    target_guid: guid
    target_pid: int
  registry:
    pid: int
  service:
    pid: int
    ppid: int
  socket:
    pid: int
    success: bool
    local_address: ip
    local_port: int
    remote_port: int
    remote_address: ip
  thread:
    src_pid: int
    src_tid: int
    tgt_pid: int
    tgt_tid: int
    stack_base: hexaddr
    stack_limit: hexaddr
    start_address: hexaddr
    user_stack_base: hexaddr
    user_stack_limit: hexaddr
  user_session:
    dest_ip: ip
    dest_port: int
    login_id: hexaddr
    src_ip: ip
    src_port: int
    login_successful: bool
